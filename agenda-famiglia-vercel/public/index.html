<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#2f6f5e">
<title>Agenda di famiglia</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#76746d;--ln:#e4e2db;--ac:#2f6f5e;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#222221;--tx:#f1efe8;--mu:#a09e96;--ln:#363633;--ac:#5fb59d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:14px 14px 90px}h1{font-size:22px;margin:4px 0 10px}
button,input,select{font:inherit;color:inherit}
.nav{display:flex;gap:8px;align-items:center;margin-bottom:10px}.nav .d{flex:1;text-align:center;font-weight:600;text-transform:capitalize}
.b{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px 12px}
.pri{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{white-space:nowrap;border:1px solid var(--ln);background:var(--card);border-radius:99px;padding:5px 12px;font-size:14px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.t{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--ln);border-left-width:5px;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.t.done .n{text-decoration:line-through;color:var(--mu)}.t .x{flex:1;min-width:0}.n{font-weight:600}.m{font-size:13px;color:var(--mu)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--ln);background:none;flex:none}.done .ck{background:var(--ac);border-color:var(--ac)}
.del{background:none;border:0;color:var(--mu);font-size:20px}.empty{text-align:center;color:var(--mu);padding:30px 0}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;font-size:30px;padding:0;box-shadow:0 4px 14px #0004}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--tx);width:min(92vw,420px);padding:16px}dialog::backdrop{background:#0006}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
dialog input,dialog select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg)}
.row{display:flex;gap:8px}.row>*{flex:1}.foot{display:flex;gap:8px;margin-top:14px}
</style></head><body><main>
<h1>🏠 Agenda di famiglia</h1>
<div class="nav"><button class="b" id="pv">‹</button><div class="d" id="dl"></div><button class="b" id="nx">›</button></div>
<div class="chips" id="fc"></div><div id="ls"></div>
<div class="foot"><button class="b" id="nt">🔔 Attiva notifiche su questo telefono</button></div>
</main>
<button class="pri fab" id="add">+</button>
<dialog id="dg"><b>Nuova attività</b>
<label>Titolo</label><input id="f_t" placeholder="Es. Compiti di matematica">
<div class="row"><div><label>Categoria</label><select id="f_c"></select></div><div><label>Per chi</label><input id="f_w" list="wl" placeholder="Nome (vuoto = tutti)"><datalist id="wl"></datalist></div></div>
<div class="row"><div><label>Data</label><input type="date" id="f_d"></div><div><label>Ora</label><input type="time" id="f_h"></div></div>
<label>Avviso</label><select id="f_r"><option value="-1">Nessuno</option><option value="0">All'ora</option><option value="10" selected>10 min prima</option><option value="30">30 min prima</option><option value="60">1 ora prima</option></select>
<div class="foot"><button class="pri" id="sv">Salva</button><button class="b" id="cn">Annulla</button></div></dialog>
<script>
const CATS={Scuola:'#3b7dd8',Casa:'#c98a1b','Tempo libero':'#2f9e6b',Spesa:'#d1517a',Salute:'#8a5fd1',Altro:'#76746d'};
const $=id=>document.getElementById(id);
let tasks=[],day=new Date(),filt='Tutte',code=localStorage.getItem('code')||'';
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,m='GET',b){
  const r=await fetch('/api/'+p,{method:m,headers:{'content-type':'application/json','x-code':code},body:b?JSON.stringify(b):undefined});
  if(r.status===401){const c=prompt('Codice famiglia');if(c===null)throw 0;code=c;localStorage.setItem('code',c);return api(p,m,b)}
  return r.json()}
async function load(){try{tasks=await api('tasks');render()}catch(e){}}
function render(){
  $('dl').textContent=day.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  $('fc').innerHTML=['Tutte',...Object.keys(CATS)].map(c=>`<button class="chip ${c===filt?'on':''}" data-c="${c}">${c}</button>`).join('');
  const l=tasks.filter(t=>t.date===iso(day)&&(filt==='Tutte'||t.cat===filt)).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
  $('ls').innerHTML=l.length?l.map(t=>`<div class="t ${t.done?'done':''}" style="border-left-color:${CATS[t.cat]||'#999'}"><button class="ck" data-k="${t.id}"></button><div class="x"><div class="n">${esc(t.title)}</div><div class="m">${t.time||'Tutto il giorno'} · ${esc(t.cat)}${t.who?' · '+esc(t.who):''}${t.at?' · 🔔':''}</div></div><button class="del" data-x="${t.id}">×</button></div>`).join(''):'<div class="empty">Nessuna attività. Tocca + per aggiungerne una.</div>';
  $('wl').innerHTML=[...new Set(tasks.map(t=>t.who).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join('')}
async function put(t){const i=tasks.findIndex(x=>x.id===t.id);i<0?tasks.push(t):tasks[i]=t;render();try{await api('tasks','POST',t)}catch(e){}}
$('ls').onclick=async e=>{const k=e.target.dataset.k,x=e.target.dataset.x;
  if(k){const t=tasks.find(t=>t.id===k);put({...t,done:!t.done})}
  if(x&&confirm('Eliminare?')){tasks=tasks.filter(t=>t.id!==x);render();try{await api('tasks?id='+x,'DELETE')}catch(e){}}};
$('fc').onclick=e=>{if(e.target.dataset.c){filt=e.target.dataset.c;render()}};
$('pv').onclick=()=>{day.setDate(day.getDate()-1);render()};$('nx').onclick=()=>{day.setDate(day.getDate()+1);render()};
$('f_c').innerHTML=Object.keys(CATS).map(c=>`<option>${c}</option>`).join('');
$('add').onclick=()=>{$('f_t').value='';$('f_d').value=iso(day);$('f_h').value='';$('dg').showModal()};
$('cn').onclick=()=>$('dg').close();
$('sv').onclick=()=>{const title=$('f_t').value.trim();if(!title){$('f_t').focus();return}
  const date=$('f_d').value||iso(day),time=$('f_h').value,rem=+$('f_r').value;
  const at=time&&rem>=0?new Date(date+'T'+time).getTime()-rem*60000:null;
  put({id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),title,cat:$('f_c').value,who:$('f_w').value.trim(),date,time,at,done:false,sent:false});$('dg').close()};
const u8=k=>{const p='='.repeat((4-k.length%4)%4),r=atob((k+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
$('nt').onclick=async()=>{
  if(!('PushManager' in window)){alert("Prima aggiungi l'app alla schermata Home (Condividi → Aggiungi a Home), poi aprila da lì e riprova.");return}
  const name=prompt('Chi usa questo telefono? (es. Marco)',localStorage.getItem('me')||'');if(name===null)return;localStorage.setItem('me',name.trim());
  try{if(await Notification.requestPermission()!=='granted'){alert('Permesso negato');return}
    const reg=await navigator.serviceWorker.register('/sw.js');await navigator.serviceWorker.ready;
    const {key}=await api('subscribe');
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(key)});
    await api('subscribe','POST',{sub:sub.toJSON(),name:name.trim()});alert('Notifiche attivate ✓')}catch(e){alert('Errore: '+(e&&e.message||e))}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
render();load();setInterval(load,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script></body></html>
